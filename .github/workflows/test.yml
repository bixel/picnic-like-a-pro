name: Tests

on:
  # Only main on push: branch pushes are already covered by pull_request, and
  # listening to both would run every PR twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs when a branch is pushed again.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # PICNIC_MOCK keeps the suite off the real Picnic API. No credentials
      # are needed and no checkout can be triggered.
      - name: Run test suite with coverage
        env:
          PICNIC_MOCK: "true"
          PICNIC_MOCK_PERSIST_CART: "false"
        run: |
          uv run pytest \
            --cov=picnic_meal_planner \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            junit.xml

  # The suite above runs directly on the runner, which says nothing about
  # whether the images actually build. This job builds both targets and runs
  # the suite inside the test image, i.e. what `make test-docker` does locally.
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: picnic-meal-planner:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: true
          tags: picnic-meal-planner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A plain `docker build` must keep producing the production image, not
      # the test stage that sits in front of it in the Dockerfile.
      - name: Default build target is the production runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: picnic-meal-planner:default
          cache-from: type=gha

      - name: Default target matches the runtime target
        run: |
          default=$(docker image inspect picnic-meal-planner:default --format '{{.Config.Cmd}} {{.Config.Entrypoint}}')
          runtime=$(docker image inspect picnic-meal-planner:runtime --format '{{.Config.Cmd}} {{.Config.Entrypoint}}')
          echo "default=$default"
          echo "runtime=$runtime"
          [ "$default" = "$runtime" ]

      # Guards the documented production deploy step, `alembic upgrade head`,
      # which needs these files present inside the image.
      - name: Production image can run migrations
        run: |
          docker run --rm --entrypoint sh picnic-meal-planner:runtime -c '
            test -f alembic.ini && test -d alembic/versions && echo "alembic present"
          '
          docker run --rm --entrypoint sh \
            -e DB_PATH=/tmp/deploy-check.db picnic-meal-planner:runtime -c '
              alembic upgrade head && echo "migrations applied"
            '

      - name: Run the suite inside the test image
        run: docker compose -f docker-compose.test.yml run --rm picnic-test

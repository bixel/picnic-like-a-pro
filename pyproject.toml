[project]
name = "picnic-meal-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-picnic-api2>=1.3",
    "mcp[cli]>=1.9",
    "anthropic>=0.40",
    "python-telegram-bot[ext]>=22",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.scripts]
bot = "picnic_meal_planner.bot:main"
mcp-server = "picnic_meal_planner.mcp_server:main"
# import-history is a standalone script (not a package); run it directly:
#   uv run python scripts/import_history.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picnic_meal_planner"]

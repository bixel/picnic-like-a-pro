[project]
name = "picnic-meal-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-picnic-api2>=1.3",
    # <2: mcp 2.0 removed mcp.server.fastmcp, which mcp_server.py imports.
    "mcp[cli]>=1.9,<2",
    "anthropic>=0.40",
    "python-telegram-bot[ext]>=22",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.scripts]
bot = "picnic_meal_planner.bot:main"
mcp-server = "picnic_meal_planner.mcp_server:main"
# import-history is a standalone script (not a package); run it directly:
#   uv run python scripts/import_history.py

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picnic_meal_planner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--tb=short"]

[tool.coverage.run]
source = ["src/picnic_meal_planner"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == .__main__.:']

[tool.coverage.html]
directory = "htmlcov"
